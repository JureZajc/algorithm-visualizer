[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service that turns algorithm runs into step-by-step execution states for the Algorithm Visualizer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "mypy>=2.4.1",
    "pytest>=9.0.3",
    "ruff>=0.17.5",
]

[tool.mypy]
files = ["app"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
