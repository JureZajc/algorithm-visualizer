[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service that turns algorithm runs into step-by-step execution states for the Algorithm Visualizer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.mypy]
files = ["app"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# Every module leaves two blank lines after its imports.
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# These aliases reach the Pydantic request and response models. Pydantic turns
# a PEP 695 `type` alias into a schema component of its own, which changes the
# OpenAPI document, so they stay `TypeAlias` annotations.
"app/algorithms/*/types.py" = ["UP040"]
