name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install backend dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff
        run: uv run ruff check . ../scripts

      - name: Check formatting
        run: uv run ruff format --check . ../scripts

      - name: Run mypy
        run: uv run mypy

      - name: Run Pytest
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: backend
        run: uv python install

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the backend and a production build of the frontend.
      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7

  api-types:
    name: Generated API types
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: backend
        run: uv python install

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate API types
        run: npm run generate:api

      # The generated files are committed; any difference means a backend
      # model, label, or limit changed without regenerating them.
      - name: Check that the API types are up to date
        run: |
          if [ -n "$(git status --porcelain -- types/generated)" ]; then
            echo "::error::The generated API types are stale. Run 'npm run generate:api' in frontend/ and commit the result."
            git status --short -- types/generated
            git diff -- types/generated
            exit 1
          fi
