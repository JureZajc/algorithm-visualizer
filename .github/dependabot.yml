version: 2

# Each ecosystem gets one grouped pull request a week instead of one per
# dependency. Grouping also keeps packages that must move together, such as
# react and react-dom, in the same pull request.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # The project pins Node.js 24 (.nvmrc and engines), so keep its types on 24.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 6+ fails npm ci with ERESOLVE: openapi-typescript needs
      # typescript ^5.x, and typescript-eslint (through eslint-config-next)
      # needs typescript >=4.8.4 <6.1.0. Lift this when both accept the new major.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # ESLint 10 fails npm ci with ERESOLVE: eslint-config-next depends on
      # eslint-plugin-react, eslint-plugin-import, and eslint-plugin-jsx-a11y,
      # whose eslint peer ranges stop at ^9. Lift this when all three accept it.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
