version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # The project pins Node.js 22 (.nvmrc and engines), so keep its types on 22.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
